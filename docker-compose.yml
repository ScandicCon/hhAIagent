services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hh}
      POSTGRES_DB: hh_agent
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d hh_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "${API_PORT:-9090}:8000"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://hh:${POSTGRES_PASSWORD:-hh}@db:5432/hh_agent}
    volumes:
      - hh_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      BACKEND_URL: "http://api:8000"
      DIGEST_CONCURRENCY: ${DIGEST_CONCURRENCY:-3}
      # На VPS оставь пустым в .env; локально на Windows: socks5://host.docker.internal:10808
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      NO_PROXY: "api,localhost,127.0.0.1,db"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hh_data:
  pg_data:
