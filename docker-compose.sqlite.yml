# Лёгкий локальный режим без PostgreSQL (только API + бот).
# Запуск: docker compose -f docker-compose.sqlite.yml up -d --build
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "${API_PORT:-9090}:8000"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      DATABASE_URL: "sqlite:////app/data/hh_agent.db"
    volumes:
      - hh_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      BACKEND_URL: "http://api:8000"
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      NO_PROXY: "api,localhost,127.0.0.1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hh_data:
